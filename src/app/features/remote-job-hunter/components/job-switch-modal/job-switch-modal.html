<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 px-4 backdrop-blur-sm"
>
  <div
    class="w-full max-w-md rounded-3xl border border-cyan-400/20 bg-slate-900 p-6 shadow-[0_0_60px_rgba(34,211,238,0.16)]"
  >
    <p class="mb-3 text-sm font-semibold uppercase tracking-[0.25em] text-cyan-300">Change job</p>

    <h3 class="text-2xl font-bold text-white">Switch to {{ job().position }}?</h3>

    <p class="mt-3 leading-7 text-slate-300">
      You already have a current job. If you accept this offer, your current job will be replaced
      with a new one.
    </p>

    <div class="mt-5 rounded-2xl border border-white/10 bg-slate-950/60 p-4">
      <p class="text-sm font-semibold text-cyan-300">{{ job().company }}</p>

      <p class="mt-1 font-bold text-white">{{ job().position }}</p>

      <p class="mt-2 text-xl font-bold text-white">${{ job().salary }}</p>
    </div>

    <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="rounded-full border border-white/15 px-5 py-3 text-sm font-semibold text-slate-200 transition hover:border-cyan-300 hover:text-cyan-200"
        (click)="onCancel()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="rounded-full bg-cyan-400 px-5 py-3 text-sm font-semibold text-slate-950 shadow-[0_0_30px_rgba(34,211,238,0.25)] transition hover:scale-105 hover:bg-cyan-300"
        (click)="onConfirmSwitch()"
      >
        Confirm switch
      </button>
    </div>
  </div>
</div>
